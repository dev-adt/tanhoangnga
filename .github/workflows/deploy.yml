name: Build & Deploy Standalone

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./data/tanhoangnga.db"

      - name: Clean Previous Builds
        run: rm -rf .next release

      - name: Build Next.js Standalone
        run: npm run build
        env:
          DATABASE_URL: "file:./data/tanhoangnga.db"

      - name: Validate Marketing Routes are Dynamic (Zero Route Cache)
        run: |
          echo "==> Kiểm tra prerender-manifest..."
          if grep -q '"/": {' .next/prerender-manifest.json 2>/dev/null; then
            echo "❌ Lỗi: Route '/' vẫn bị tính là static prerender!"
            exit 1
          fi
          echo "✅ Tất cả các route marketing đã được cấu hình force-dynamic / revalidate 0 thành công!"

      - name: Assemble Release Package
        run: |
          mkdir -p release
          
          # 1. Copy toàn bộ standalone bao gồm cả thư mục ẩn .next
          cp -a .next/standalone/. release/
          
          # 2. Đảm bảo .next/BUILD_ID và .next/static được chép đầy đủ
          mkdir -p release/.next
          if [ -f ".next/BUILD_ID" ]; then
            cp .next/BUILD_ID release/.next/BUILD_ID
          fi
          cp -a .next/static release/.next/static
          
          # 3. Copy thư mục static public
          if [ -d "public" ]; then
            cp -a public release/public
          fi
          
          # 4. Copy Prisma Schema & Seed script
          if [ -d "prisma" ]; then
            cp -a prisma release/prisma
          fi

          # 5. Copy các file cấu hình PM2 & env example
          if [ -f "ecosystem.config.cjs" ]; then
            cp ecosystem.config.cjs release/ecosystem.config.cjs
          fi
          if [ -f "ecosystem.config.js" ]; then
            cp ecosystem.config.js release/ecosystem.config.js
          fi
          if [ -f ".env.example" ]; then
            cp .env.example release/.env.example
          fi

      - name: Validate Release Artifacts
        run: |
          echo "==> Kiểm tra tính toàn vẹn của Release Package..."
          test -f release/server.js || { echo "❌ Thiếu release/server.js"; exit 1; }
          test -f release/.next/BUILD_ID || { echo "❌ Thiếu release/.next/BUILD_ID"; exit 1; }
          test -d release/.next/server || { echo "❌ Thiếu release/.next/server"; exit 1; }
          test -d release/.next/static || { echo "❌ Thiếu release/.next/static"; exit 1; }
          test -d release/public || { echo "❌ Thiếu release/public"; exit 1; }
          test -f release/prisma/schema.prisma || { echo "❌ Thiếu release/prisma/schema.prisma"; exit 1; }
          echo "✅ Tất cả các thành phần Release Package đầy đủ và hợp lệ 100%!"

      - name: Push to 'deploy' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./release
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
